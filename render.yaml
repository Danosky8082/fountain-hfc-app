services:
  - type: web
    name: fountain-hfc-api
    runtime: node
    repo: https://https://github.com/Danosky8082/fountain-hfc-app
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # You'll set this manually in Render dashboard
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    buildCommand: npm install
    startCommand: npm start